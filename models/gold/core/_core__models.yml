models:
  - name: dim_perfumes
    description: Dimensión de perfumes desnormalizada. Una fila por perfume.
    columns:
      - name: perfume_id
        data_tests: [unique, not_null]
      - name: perfume_name
        data_tests: [not_null]
      - name: brand_name
        data_tests: [not_null]
      - name: brand_category
        description: Categoría del seed brand_categories; 'other' si la marca no está en el seed.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['designer', 'niche', 'low_cost', 'other']
      - name: gender
        description: Etiqueta de género.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['female', 'male', 'unisex']
      - name: dominant_season
        description: Estación con más votos; nulo si nadie ha votado estaciones.
        data_tests:
          - accepted_values:
              arguments:
                values: ['winter', 'spring', 'summer', 'autumn']
      - name: dominant_daypart
        data_tests:
          - accepted_values:
              arguments:
                values: ['day', 'night']

  - name: fct_zara_dupes
    description: Una fila por pareja de perfumes (zara y original).
    columns:
      - name: dupe_original_id
        description: Clave subrogada generada a partir de los ids de la pareja de perfumes.
        data_tests: [unique, not_null]
      - name: dupe_perfume_id
        description: Perfume de Zara.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_perfumes')
                field: perfume_id
      - name: original_perfume_id
        description: Perfume de diseñador o de nicho con el que se compara.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_perfumes')
                field: perfume_id
      - name: similarity_rank
        description: Rango de similaridad. 1 = el original más parecido.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: "{{ var('dupe_candidates') }}"
      - name: similarity
        description: Similitud del coseno entre los acordes, de 0 a 1 (1 = mismo perfil).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: similarity_band_id
        description: Tramo de similitud (dim_similarity_bands). Sirve para agrupar y filtrar en el dashboard.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_similarity_bands')
                field: similarity_band_id
      - name: shared_accords
        description: Número de acordes que comparten el dupe y el original (máx. 8).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 8
      - name: same_gender
        description: TRUE si el dupe y el original tienen la misma etiqueta de género.
      - name: bayesian_rating_diff
        description: Valoración bayesiana del dupe menos la del original. Negativo = el dupe gusta menos.
      - name: longevity_diff
        description: Longevidad del dupe menos la del original. Negativo = el dupe dura menos.
      - name: sillage_diff
        description: Estela del dupe menos la del original. Negativo = el dupe proyecta menos.
      - name: price_value_diff
        description: Calidad/precio del dupe menos la del original. Positivo = el dupe se percibe mejor pagado.
  
  - name: dim_similarity_bands
    description: Tramos de similitud para agrupar las parejas de fct_zara_dupes. Sale del seed similarity_bands. 
    columns:
      - name: similarity_band_id
        description: Id del tramo.
        data_tests: [unique, not_null]
      - name: band_name
        description: Nombre del tramo (Casi idéntico, Muy parecido, Parecido, Algo parecido, Poco parecido).
        data_tests: [unique, not_null]
      - name: min_similarity
        description: Límite inferior del tramo (incluido).
        data_tests: [not_null]
      - name: max_similarity
        description: Límite superior del tramo (no incluido). Nulo en el tramo superior.
      - name: sort_order
        description: Orden para los gráficos (1 = casi idéntico). En Power BI, "Ordenar por columna" de band_name.
        data_tests: [unique, not_null]
