models:
  - name: int__perfume_scores
    description: Tabla de puntuaciones de los perfumes en la última captura. Una fila por perfume.
    columns:
      - name: perfume_id
        data_tests: [unique, not_null]
      - name: bayesian_rating
        description: Media bayesiana. Evita que haya sesgo si hay menos votos.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
      - name: dominant_season
        description: Estación más votada.
        data_tests:
          - accepted_values:
              arguments:
                values: ['winter', 'spring', 'summer', 'autumn']
      - name: dominant_daypart
        description: Momento del día más votado.
        data_tests:
          - accepted_values:
              arguments:
                values: ['day', 'night']