models:
  - name: slv_kaggle__perfumes
    description: Perfumes deduplicados con sus características básicas (marca, género, año de lanzamiento...).
    columns:
      - name: perfume_id
        data_tests: [unique, not_null]
      - name: slug
      - name: perfume_name
        data_tests: [not_null]
      - name: brand_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_kaggle__brands')
                field: brand_id
      - name: collection_id
        description: Nulo cuando el perfume no pertenece a ninguna colección.
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_kaggle__collections')
                field: collection_id
      - name: gender
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['female', 'male', 'unisex']
      - name: release_year
        description: Año de lanzamiento. Nulo en algunos perfumes, hay valores anómalos en origen.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1900
                max_value: 2027
              config:
                severity: warn
      - name: url
      - name: description

  - name: slv_kaggle__brands
    description: Marcas con su ID respectivo, manteniendo el formato de mayus/minus de fuente.
    columns:
      - name: brand_id
        data_tests: [unique, not_null]
      - name: brand_name
        data_tests: [unique, not_null]
  
  - name: slv_kaggle__collections
    description: Colecciones deduplicadas.
    columns:
      - name: collection_id
        data_tests: [unique, not_null]
      - name: brand_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_kaggle__brands')
                field: brand_id
      - name: collection_name
        data_tests: [not_null]
  
  - name: slv_kaggle__perfumers
    description: Catálogo de perfumistas sin duplicados.
    columns:
      - name: perfumer_id
        data_tests: [unique, not_null]
      - name: perfumer_name
        data_tests: [unique, not_null]
  
  - name: slv_kaggle__perfume_perfumer
    description: Tabla puente identificando un perfume con su(s) perfumista(s).
    columns:
      - name: perfume_perfumer_id
        description: Clave compuesta identificando cada fila.
        data_tests: [unique, not_null]
      - name: perfume_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_kaggle__perfumes')
                field: perfume_id
      - name: perfumer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_kaggle__perfumers')
                field: perfumer_id

  - name: slv_kaggle__accords
    description: Catálogo de todos los acordes posibles de un perfume.
    columns:
      - name: accord_id
        data_tests: [unique, not_null]
      - name: accord_name
        data_tests: [unique, not_null]

  - name: slv_kaggle__perfume_accord
    description: Tabla puente identificando un perfume con sus acordes (8 como máximo).
    columns:
      - name: perfume_accord_id
        description: Clave compuesta identificando cada fila.
        data_tests: [unique, not_null]
      - name: perfume_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_kaggle__perfumes')
                field: perfume_id
      - name: accord_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_kaggle__accords')
                field: accord_id
      - name: strength
        description: Intensidad del acorde, del 1 al 100.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100
      - name: position
        description: Posición del acorde del 1 al 8, de mayor a menor intensidad.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 8

  - name: slv_kaggle__notes
    description: Catálogo de todas las notas posibles de un perfume en sus diferentes niveles.
    columns:
      - name: note_id
        data_tests: [unique, not_null]
      - name: note_name
        data_tests: [unique, not_null]
  
  - name: slv_kaggle__perfume_note
    description: Tabla puente identificando un perfume con sus distintas notas, el nivel correspondiente y su peso.
    columns:
      - name: perfume_note_id
        data_tests: [unique, not_null]
      - name: perfume_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_kaggle__perfumes')
                field: perfume_id
      - name: note_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_kaggle__notes')
                field: note_id
      - name: level
        data_tests:
          - accepted_values:
              arguments:
                values: ['top', 'middle', 'base', 'flat']
      - name: weight
        description: Peso votado de la nota, del 0 al 100.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: slv_kaggle__perfume_metrics
    description: Histórico de las distintas valoraciones del perfume en un instante temporal.
      Algunas de las métricas_avg tienen valor 0, se corrigen a null, pero no se sustituyen por la avg calculada.
      Los votos de la métrica con avg calculada se encuentran en slv_kaggle__perfume_metric_votes
    data_tests:
      - non_negative_values:
          arguments:
            column_name:
              - rating_vote_count
              - have_count
              - had_count
              - want_count
              - perceived_female_votes
              - perceived_female_leaning_votes
              - perceived_unisex_votes
              - perceived_male_leaning_votes
              - perceived_male_votes
              - winter_votes
              - spring_votes
              - summer_votes
              - autumn_votes
              - day_votes
              - night_votes
              - popularity
              - compound_popularity
              - recent_popularity
    columns:
      - name: perfume_metrics_id
        data_tests: [unique, not_null]
      - name: perfume_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_kaggle__perfumes')
                field: perfume_id
      - name: rating_avg
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
      - name: rating_vote_count
        description: Número de votos de valoración. Sustituye a people, que coincide siempre con él.
      - name: longevity_avg
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
      - name: sillage_avg
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 4
      - name: price_value_avg
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
      - name: captured_at_utc
        description: Fecha de captura de la página (scraped_at), en UTC.
        data_tests: [not_null]
    
  - name: slv_kaggle__perfume_metric_votes
    description: Histórico de los votos por puntuación de cada métrica (histograma), en formato largo. 
      Una fila por perfume, captura, métrica y puntuación. Se obtiene con UNPIVOT de las columnas
      rating_b1..b5, longevity_b1..b5, sillage_b1..b4 y price_value_b1..b5.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "metric <> 'sillage' or score <= 4"
    columns:
      - name: perfume_votes_id
        data_tests: [unique, not_null]
      - name: perfume_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_kaggle__perfumes')
                field: perfume_id
      - name: captured_at_utc
        description: Fecha de captura de la página, en UTC.
        data_tests: [not_null]
      - name: metric
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['rating', 'longevity', 'sillage', 'price_value']
      - name: score
        description: Puntuación del bucket, de 1 a 5 (de 1 a 4 en estela).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
      - name: vote_count
        description: Número de votos que recibió esa puntuación.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0